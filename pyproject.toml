[project]
name = "gestao-de-produtos"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pandas>=2.0.0",
    "defusedxml>=0.7.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "psycopg[binary]==3.2.13",
]

[tool.vercel]
entrypoint = "server:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && VITE_VERCEL_DEPLOYMENT=1 npm --prefix frontend run build"
